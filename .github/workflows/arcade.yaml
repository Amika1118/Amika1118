name: Generate Arcade Contribution Graph

on:
  schedule:
    # Every 6 hours; each run trains fresh agents and re-rolls the default game.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Never let two runs race to force-push the output branch.
concurrency:
  group: arcade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Generate classic arcade SVGs
        # Classic renderers are optional: if this fails we can still publish the AI games.
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper"

      - name: Train the AI arcade agents
        # Likewise optional: a failure here still publishes the classic games.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 .github/scripts/ai_arcade.py
          --user "${{ github.repository_owner }}"
          --out ai_dist

      - name: Assemble the public folder (SVGs + manifest + viewer)
        # Fails the run only if there is nothing at all to publish.
        run: >
          python3 .github/scripts/build_site.py
          --classic dist
          --ai ai_dist
          --viewer .github/viewer/index.html
          --out public

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
