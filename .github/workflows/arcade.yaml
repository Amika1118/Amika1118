name: Generate Arcade Contribution Graph

on:
  schedule:
    # Runs every 6 hours; each run picks a new random arcade game.
    # For more frequent changes use e.g. "0 * * * *" (hourly).
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Generate arcade game SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout,galaga,puzzle-bobble,bomberman"

      - name: Pick a random game
        run: |
          games=(pacman breakout galaga puzzle-bobble bomberman)
          pick=${games[RANDOM % ${#games[@]}]}
          echo "Picked game: $pick"

          mkdir -p public
          cp "dist/${pick}-contribution-graph.svg" public/arcade.svg
          cp "dist/${pick}-contribution-graph-dark.svg" public/arcade-dark.svg
          ls -la public

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}