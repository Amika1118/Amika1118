name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - output

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Unit + smoke tests (no network, no token)
        run: python3 -m unittest discover -s .github/scripts -v
